[project]
name = "multi-modal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gauravpatil11", email = "gpatil43000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=0.37.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pinecone>=7.3.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "tabulate>=0.10.0",
]

[project.scripts]
multi-modal-rag = "multi_modal_rag:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
